name: basic
on:
    push

jobs:
    says_hello:
        runs-on: ubuntu-latest
        steps:
            - name: "print"
              uses: actions/checkout@v4
            - name: "run"
              run: |
                echo "Hello from $GITHUB_REPOSITORY"
                echo "Branch: $GITHUB_REF_NAME"
                ls -la
    says_hi:
        runs-on: ubuntu-latest
        steps:
            - name: print2
              env: 
                REPO_NAME: ${{github.event.repository.name}}
              run: |
                 if echo REPO_NAME | grep -iEq "^prosight-automation"; then
                  echo "Same Repo"
                 else
                  echo "Diff Repo"
                  echo  "Hello World" | grep "77445"
                 fi